<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zaman Paints & Decor Logo</title>
  <desc id="desc">A modern paint drop and brush logo with brand name Zaman Paints & Decor</desc>
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7B00"/>
      <stop offset="100%" stop-color="#FF4D00"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- circular paint badge -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="38" fill="url(#g1)" filter="url(#f1)" />
    <!-- paint drop -->
    <path d="M -6 -6 C -6 -14 6 -22 18 -8 C 26 4 14 22 0 20 C -14 18 -6 2 -6 -6 Z" fill="#fff" opacity="0.96" transform="translate(-6,2) scale(0.9)"/>
    <!-- brush handle -->
    <rect x="22" y="20" width="40" height="8" rx="4" transform="rotate(18 22 20)" fill="#4b5563" opacity="0.9"/>
  </g>

  <!-- Brand name -->
  <g transform="translate(120,75)">
    <text x="0" y="-6" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="20" fill="#111">Zaman Paints</text>
    <text x="0" y="18" font-family="Poppins, Arial, sans-serif" font-weight="500" font-size="12" fill="#555">& Decor</text>
  </g>
</svg>
